<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamProxy Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <h1>Extension settings</h1>
      <p class="subtitle">Choose which StreamProxy instance receives your data.</p>

      <form id="options-form">
        <label for="baseUrl">StreamProxy base URL</label>
        <input id="baseUrl" name="baseUrl" type="url" placeholder="http://127.0.0.1:3000" required />

        <label for="username">Username (optional)</label>
        <input id="username" name="username" type="text" autocomplete="username" />

        <label for="password">Password (optional)</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <button type="submit">Save</button>
      </form>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
